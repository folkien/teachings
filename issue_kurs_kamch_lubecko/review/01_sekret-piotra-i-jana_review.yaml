slides:
  - type: illustration
    title: "Sekret skuteczności"
    subtitle: "Modlitwa prowadziła Piotra i Jana do uzdrowienia, świadectwa i ponownego napełnienia Duchem Świętym."
    image: "../1.sekret-piotra-i-jana/01_sekret-skutecznosci.jpg"

  - type: illustration
    title: "Rytm życia apostołów"
    subtitle: "Modlitwa osobista prowadzi do modlitwy wspólnotowej i ewangelizacji, a ewangelizacja prowadzi z powrotem do modlitwy."
    image: "01_rytm-zycia-apostolow.jpg"

  - type: quote
    title: "Modlitwa i posługa Słowa"
    text: "My zaś oddamy się wyłącznie modlitwie i posłudze słowa"
    reference: "Dz 6,4"

  - type: illustration
    title: "Centrum życia z Bogiem"
    subtitle: "W modlitwie osobistej karmimy się Chrystusem i spotykamy się z Nim każdego dnia."
    image: "../1.sekret-piotra-i-jana/02_centrum-zycia-z-bogiem.jpg"

  - type: illustration
    title: "Posłuszeństwo i Duch"
    subtitle: "Decyzja modlitwy poddaje człowieka Bogu, który daje Ducha Świętego posłusznym."
    image: "../1.sekret-piotra-i-jana/03_posluszenstwo-i-duch.jpg"

  - type: illustration
    title: "Osobiste świadectwo"
    subtitle: "Podstawą każdej ewangelizacji jest świadectwo o tym, co Chrystus uczynił w naszym życiu."
    image: "../1.sekret-piotra-i-jana/04_osobiste-swiadectwo.jpg"

  - type: illustration
    title: "Rozdawanie Chleba"
    subtitle: "W ewangelizacji pokazujemy innym głodnym, gdzie jest Chleb."
    image: "../1.sekret-piotra-i-jana/05_rozdawanie-chleba.jpg"

  - type: illustration
    title: "Schemat modlitwy osobistej"
    subtitle: "Schemat pomaga na początku praktykowania modlitwy osobistej i prowadzi do spotkania z Bogiem."
    image: "../1.sekret-piotra-i-jana/06_schemat-modlitwy-osobistej.jpg"

  - type: key_sentence
    title: "Zdanie kluczowe"
    text: "Nie może Ci zabraknąć modlitwy i głoszenia Słowa!"
