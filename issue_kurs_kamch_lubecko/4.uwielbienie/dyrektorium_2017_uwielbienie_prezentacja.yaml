status: "zaakceptowana"

output:
  markdown: "dyrektorium_2017_uwielbienie_prezentacja.md"
  pptx: "t4.uwielbienie_prezentacja.pptx"

theme:
  font: "DejaVu Sans"
  header_color: "#FF6500"
  key_color: "#F6C82F"
  text_color: "#111111"

slides:
  - type: illustration
    title: "Jezus w centrum"
    subtitle: "Doświadczenie Pięćdziesiątnicy prowadzi do uwielbienia Jezusa i oddawania chwały Bogu."
    image: "01_jezus-w-centrum.jpg"

  - type: quote
    title: "Dlatego, że On jest"
    text: "Wysławia Go dla Niego samego, oddaje Mu chwałę nie ze względu na to, co On czyni, ale dlatego że On JEST"
    reference: "KKK 2639"

  - type: illustration
    title: "Uwielbienie w trudnościach"
    subtitle: "Paweł i Sylas wielbili Boga także w więzieniu, a On działał pośród ich trudności (Dz 16,25–26)."
    image: "02_uwielbienie-w-trudnosciach-poprawione-oko.jpg"

  - type: illustration
    title: "Od siebie ku Bogu"
    subtitle: "W uwielbieniu człowiek przestaje skupiać się na sobie i kieruje całe serce ku Bogu."
    image: "03_od-siebie-ku-bogu-wzor-banera.jpg"

  - type: illustration
    title: "Kwiat i Ogrodnik"
    subtitle: "Gdy Ty zajmujesz się Bogiem, On zajmuje się Tobą i daje Ci wzrost."
    image: "04_kwiat-i-ogrodnik.jpg"

  - type: illustration
    title: "Uwielbienie jako sposób życia"
    subtitle: "Śpiewem, słowami i w ciszy zwracamy serce ku Bogu. Duch Święty uczy tak żyć każdego dnia."
    image: "05_sposob-zycia.jpg"

  - type: key_sentence
    title: "Zdanie kluczowe"
    text: "Uwielbienie jest drogą do Jezusa!"
