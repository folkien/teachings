output:
  markdown: "dyrektorium_2017_prowadzenie-modlitwy-wspolnotowej_prezentacja.md"
  pptx: "dyrektorium_2017_prowadzenie-modlitwy-wspolnotowej_prezentacja.pptx"

theme:
  font: "DejaVu Sans"
  header_color: "#FF6500"
