slides:
  - type: illustration
    title: "Cel spotkania"
    subtitle: "Sposób prowadzenia zależy od celu, uczestników i typu spotkania. Zawsze chodzi o spotkanie z Bogiem."
    image: "../6.prowadzenie-modlitwy-wspolnotowej/01_cel-spotkania.jpg"

  - type: illustration
    title: "Jeden głos, jeden cel"
    subtitle: "Wspólnota jednoczy głos i pragnienie, aby spotkać się z Bogiem w uwielbieniu (2 Krn 5,11–14; Dz 2,46–47)."
    image: "06_jeden-glos-jeden-cel-biale-tlo.jpg"

  - type: illustration
    title: "Przygotowanie spotkania"
    subtitle: "Przygotowanie duchowe obejmuje modlitwę ekipy, a praktyczne przygotowanie miejsca i nagłośnienia."
    image: "06_przygotowanie-spotkania.jpg"

  - type: illustration
    title: "Duch Święty prowadzi"
    subtitle: "Prowadzący usuwa się w cień, aby Duch Święty prowadził wspólnotę w uwielbieniu."
    image: "../6.prowadzenie-modlitwy-wspolnotowej/03_duch-swiety-prowadzi.jpg"

  - type: illustration
    title: "Pokora i miłość"
    subtitle: "Prowadzący zachęca i nadaje jasny kierunek, ale nie manipuluje atmosferą, nie straszy ani nie oskarża."
    image: "06_pokora-i-milosc-biale-tlo.jpg"

  - type: illustration
    title: "Człowiek modlitwy"
    subtitle: "Nie można prowadzić innych w modlitwie bez własnego, osobistego spotkania z Bogiem."
    image: "../6.prowadzenie-modlitwy-wspolnotowej/05_czlowiek-modlitwy.jpg"

  - type: illustration
    title: "Wspólna odpowiedzialność"
    subtitle: "Jakość spotkania zależy od modlitwy, otwartości i zaangażowania każdego uczestnika."
    image: "06_wspolna-odpowiedzialnosc-biale-tlo.jpg"

  - type: illustration
    title: "Porządek spotkania"
    subtitle: "Przygotowanie prowadzi przez wejście w modlitwę i kerygmat do wspólnego zakończenia."
    image: "06_porzadek-spotkania-biale-tlo.jpg"

  - type: key_sentence
    title: "Zdanie kluczowe"
    text: "Duch Święty jest Duchem porządku"
